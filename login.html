<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault - Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">CV</span>
      <h2>CryptoVault</h2>
    </div>

    <div class="auth-header">
      <h3>Welcome Back</h3>
      <p>Sign in to access your crypto portfolio</p>
    </div>

    <!-- نموذج تسجيل الدخول مع التحقق HTML5 -->
    <form action="index.html" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="alex@example.com" required class="auth-input">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" minlength="6" required class="auth-input">
      </div>

      <div class="auth-options">
        <label class="remember-label">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="auth-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary full-width">Sign In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a>
    </p>
  </div>

</body>
</html>
