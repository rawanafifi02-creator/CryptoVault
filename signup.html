<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">CV</span>
      <h2>CryptoVault</h2>
    </div>

    <div class="auth-header">
      <h3>Create Account</h3>
      <p>Start managing your crypto assets securely</p>
    </div>

    <!-- نموذج إنشاء حساب مع التحقق HTML5 -->
    <form action="index.html" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Alex Morgan" minlength="3" required class="auth-input">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="alex@example.com" required class="auth-input">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Minimum 6 characters" minlength="6" required class="auth-input">
      </div>

      <div class="auth-options">
        <label class="remember-label">
          <input type="checkbox" required> I agree to the Terms & Privacy Policy
        </label>
      </div>

      <button type="submit" class="btn-primary full-width">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link">Sign In</a>
    </p>
  </div>

</body>
</html>
